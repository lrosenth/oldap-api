[tool.poetry]
name = "oldap-api"
packages = [{ include = "oldap_api" }]
include = [{ path = "oldap_api/exports/profile_data/*.json", format = ["sdist", "wheel"] }]
version = "1.2.7"
description = "Flask API for OLDAP"
license = "AGPL-3.0-only"
authors = ["ManuelRosenthaler <rosenthalermanuel@gmail.com>", "Lukas Rosenthaler <lukas.rosenthaler@pm.me>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flask = "^3.1.3"
flask-cors = "^6.0.5"
requests = "^2.34.2"
rdflib = "^7.6.0"
gunicorn = "==27.0.1"
poetry-core = "^2.5.0"
coverage = "==7.17.5"
black = "==26.10.1"
pytest = "^9.2.0"
oldaplib = ">=1.2.6,<2.0.0"
bump-my-version = "^1.8.1"
rfc8785 = "^0.1.4"
redis = "^8.2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
coverage = "^7.17.5"
openapi-spec-validator = "^0.9.0"
black = "^26.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bumpversion]
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<release>rc)(?P<num>\d+))?'
serialize = ["{major}.{minor}.{patch}{release}{num}", "{major}.{minor}.{patch}"]
current_version = "1.2.7"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "oldap_api/version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "API-def/oldap-api.yaml"
search = "  version: {current_version}"
replace = "  version: {new_version}"
[tool.bumpversion.parts.release]
optional_value = "final"
values = ["rc", "final"]

[tool.bumpversion.parts.num]
first_value = 1

